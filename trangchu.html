<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOLOBOSS - Danh sách</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600&family=Permanent+Marker&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0d0f17;
      --amber: #f0b429;
      --serif: "Playfair Display", "Times New Roman", serif;
      --sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
      --marker: "Permanent Marker", "Comic Sans MS", cursive;
      --header-h: 84px;
      --footer-h: 56px;

      /* Tốc độ phóng to / thu nhỏ thẻ: số càng lớn càng chậm (nhớ sửa HOVER_MS trong JS cho khớp) */
      --hover-time: 0.8s;

      /* Hạt nhiễu tạo cảm giác bề mặt tường */
      --noise-dark: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .85  0 0 0 0 .75  0 0 0 0 .6  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      --noise-light: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .18  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: var(--navy); color: #f2efe8; font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--amber); outline-offset: 4px; }

    /* ================= HEADER ================= */
    .topbar {
      height: var(--header-h);
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 0 clamp(14px, 4vw, 56px);
      background: var(--navy);
      border-bottom: 2px solid var(--amber);
    }
    .left { display: flex; align-items: center; gap: clamp(10px, 2vw, 18px); min-width: 0; }

    /* Chỉ logo này bấm được */
    .brand {
      flex: none; display: grid; place-items: center;
      width: 52px; height: 52px; border-radius: 50%;
      border: 2px solid var(--amber); background: rgba(240, 180, 41, 0.08);
      cursor: pointer; transition: background 0.2s, transform 0.2s;
    }
    .brand:hover { background: rgba(240, 180, 41, 0.2); transform: scale(1.06); }
    .brand svg { width: 28px; height: 28px; fill: none; stroke: var(--amber); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* Chữ trang trí, không bấm được */
    .heading {
      cursor: default; user-select: none; min-width: 0;
      font-family: var(--serif); font-weight: 800; letter-spacing: 0.05em; line-height: 1.15;
      font-size: clamp(1rem, 3.2vw, 1.6rem); color: var(--amber);
      text-shadow: 0 2px 10px rgba(240, 180, 41, 0.25);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Nút Sáng / Tối: chỉ có 2 biểu tượng */
    .mode {
      position: relative; flex: none; display: grid; grid-template-columns: 1fr 1fr; align-items: center;
      width: 84px; height: 40px; border-radius: 999px; padding: 0;
      border: 1.5px solid rgba(240, 180, 41, 0.6); background: #141826; cursor: pointer;
    }
    .mode::before {
      content: ""; position: absolute; top: 3px; left: 3px; width: calc(50% - 3px); height: calc(100% - 6px);
      border-radius: 999px; background: rgba(240, 180, 41, 0.28);
      transition: transform 0.3s ease;
    }
    body[data-mode="light"] .mode::before { transform: translateX(100%); }
    .mode span { position: relative; text-align: center; font-size: 1.05rem; line-height: 1; }

    /* ================= BẢNG ĐIỀU TRA ================= */
    .board {
      position: relative; isolation: isolate; overflow: hidden;
      min-height: calc(100vh - var(--header-h) - var(--footer-h));
      min-height: calc(100svh - var(--header-h) - var(--footer-h));
      display: grid; place-items: center;
      padding: clamp(44px, 9vh, 100px) clamp(10px, 3vw, 48px);
      --mx: 50%; --my: 35%;
    }
    .light { position: absolute; inset: 0; z-index: 0; pointer-events: none; }

    /* Chế độ tối: tường tối + đèn pin rọi theo con trỏ */
    body[data-mode="dark"] .board {
      background-color: #15171f;
      background-image: var(--noise-dark);
    }
    body[data-mode="dark"] .light {
      background:
        radial-gradient(circle 380px at var(--mx) var(--my), rgba(255, 214, 150, 0.24), transparent 70%),
        radial-gradient(ellipse at center, transparent 30%, rgba(0, 0, 0, 0.78) 100%);
    }

    /* Chế độ sáng: tường trát vữa màu kem ấm, ánh sáng dịu từ phía trên */
    body[data-mode="light"] .board {
      background-color: #dccfb8;
      background-image:
        var(--noise-light),
        linear-gradient(180deg, #ebe1cf 0%, #d6c7ab 60%, #c4b394 100%);
    }
    body[data-mode="light"] .light {
      background:
        radial-gradient(circle 520px at var(--mx) var(--my), rgba(255, 250, 235, 0.55), transparent 70%),
        radial-gradient(ellipse at center, transparent 45%, rgba(92, 66, 36, 0.34) 100%);
    }

    .grid {
      width: 100%; max-width: 840px;
      display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between;
      column-gap: clamp(8px, 3vw, 56px);
      row-gap: clamp(26px, 7vh, 70px);
      justify-items: center;
    }

    /* ---------- Ô cố định: nhận hover, KHÔNG bị xoay/phóng to ---------- */
    .slot {
      --cw: clamp(100px, 24vw, 210px);
      position: relative; z-index: 1; width: var(--cw);
      font-size: calc(var(--cw) / 16);
    }
    .slot:hover, .slot:focus-within { z-index: 20; }

    /* ---------- Thẻ Polaroid (phần nhìn thấy, chỉ dùng transform) ---------- */
    .card {
      --rot: 0deg; --dx: 0em; --dy: 0em;
      position: relative; display: block; width: 100%;
      padding: 0.75em 0.75em 0;
      background: #f4f1ea; text-decoration: none; cursor: pointer;
      box-shadow: 0 0.5em 1.4em rgba(0, 0, 0, 0.5);
      transform: translate(var(--dx), var(--dy)) rotate(var(--rot));
      transition: transform var(--hover-time) cubic-bezier(0.22, 0.7, 0.3, 1);
      will-change: transform;
    }
    .slot:hover .card, .card:focus-visible {
      transform: translate(0, 0) rotate(0deg) scale(1.18);
      outline: none;
    }
    .card::before {
      content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
      box-shadow: 0 1em 2.4em rgba(0, 0, 0, 0.7);
      opacity: 0; transition: opacity var(--hover-time) ease-out;
    }
    .slot:hover .card::before, .card:focus-visible::before { opacity: 1; }
    .card::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: rgba(5, 7, 12, 0.38); opacity: 0; transition: opacity var(--hover-time) ease-out;
    }
    body[data-mode="dark"] .card::after { opacity: 1; }
    body[data-mode="dark"] .slot:hover .card::after, body[data-mode="dark"] .card:focus-visible::after { opacity: 0; }

    .pin {
      position: absolute; left: 50%; top: 0; width: 1.7em; height: 1.7em;
      transform: translate(-50%, -30%); border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ff8a80, #c1272d 55%, #7a1114);
    }
    .photo {
      aspect-ratio: 1 / 1.05; overflow: hidden; background: #1b1f2c;
      display: grid; place-items: center;
    }
    .photo img { display: block; width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.3) contrast(1.05); }
    .photo.noimg::after { content: "?"; font-family: var(--marker); font-size: 4em; color: #4a5068; }
    .caption {
      height: 3em; display: grid; place-items: center;
      font-family: var(--marker); font-size: 1.2em; letter-spacing: 0.04em; color: #b3201f; white-space: nowrap;
    }

    /* ---------- Dây thừng đỏ (SVG phủ lên trên các thẻ) ---------- */
    .strings { position: absolute; left: 0; top: 0; z-index: 30; pointer-events: none; overflow: visible; }
    .strings.back { z-index: 0; }  /* lớp dây nằm SAU các thẻ */
    .line { fill: none; stroke: #d3262c; stroke-width: 3.8; stroke-linecap: round; transition: stroke 0.3s; }
    .line.hot { stroke: #ff4d4d; }
    .head { stroke: #5c0d10; stroke-width: 1; }

    /* ================= CHÂN TRANG ================= */
    .foot {
      height: var(--footer-h);
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: 0 16px;
      background: var(--navy); border-top: 2px solid var(--amber);
      font-size: 0.78rem; letter-spacing: 0.14em; color: #8d93a5;
    }

    @media (max-width: 520px) {
      :root { --header-h: 72px; --footer-h: 48px; }
      .brand { width: 44px; height: 44px; }
      .brand svg { width: 24px; height: 24px; }
      .mode { width: 72px; height: 36px; }
      .line { stroke-width: 3; }
      .foot { font-size: 0.66rem; letter-spacing: 0.08em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card, .card::before, .card::after, .mode::before, .line, .twist { transition: none; }
    }
  </style>
</head>
<body data-mode="dark">

  <header class="topbar">
    <div class="left">
      <!-- Chỉ logo này là liên kết -->
      <a class="brand" href="trangchu.html" aria-label="Về trang chủ">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2.5 6.5Q12 8.8 21.5 6.5"/><path d="M5 10.5h14"/>
          <path d="M7 8.4V20M17 8.4V20M12 8.8v1.7"/>
        </svg>
      </a>
      <!-- Chữ trang trí, không bấm được -->
      <div class="heading">SOLOBOSS – DANH SÁCH</div>
    </div>

    <button type="button" class="mode" id="modeBtn" aria-label="Chuyển chế độ sáng / tối" aria-pressed="false">
      <span aria-hidden="true">🌙</span><span aria-hidden="true">☀️</span>
    </button>
  </header>

  <main class="board" id="board">
    <div class="light" aria-hidden="true"></div>
    <svg class="strings back" id="stringsBack" aria-hidden="true"></svg>
    <div class="grid" id="grid"></div>
    <svg class="strings" id="strings" aria-hidden="true"></svg>
  </main>

  <!-- CHÂN TRANG: đổi chữ tùy ý -->
  <footer class="foot">© 2026 SOLOBOSS · KILL OR BE KILLED</footer>

  <script>
    /* ==========================================================
       DỮ LIỆU: đổi ảnh / tiêu đề / liên kết / dây nối tại đây
       - connections: id các thẻ mà thẻ này nối dây tới
       - hang: các sợi dây kéo thẳng lên phía trên rồi ra khỏi bảng
               (số = độ lệch ngang so với ghim, tính theo tỉ lệ chiều rộng bảng)
    ========================================================== */
    const evidenceList = [
      { id: "1", image: "1.jpg", title: "Dictatorship-Phu Vuong", link: "baitap1.html", connections: ["2", "4", "5"], hang: [-0.07] },
      { id: "2", image: "2.jpg", title: "Samurai", link: "baitap2.html", connections: ["3", "4", "6"], hang: [-0.07, 0.07] },
      { id: "3", image: "3.jpg", title: "???", link: "baitap3.html", connections: ["4", "6"],       hang: [-0.07] },
      { id: "4", image: "4.jpg", title: "???", link: "baitap4.html", connections: ["5"],            hang: [] },
      { id: "5", image: "5.jpg", title: "???", link: "baitap5.html", connections: ["6"],            hang: [] },
      { id: "6", image: "6.jpg", title: "???", link: "baitap6.html", connections: [],               hang: [] }
    ];

    // Bố cục so le như ảnh mẫu (độ nghiêng: độ; độ lệch ngang/dọc: em)
    const TILTS = [-8, 2, 6, -6, 1.5, 8];
    const DX    = [0, 0, 0, 4, 0, -1.5];
    const DY    = [1, -2, 1.2, 0.6, -1, 1.4];

    const HOVER_MS = 900; // thời gian cập nhật dây khi hover: phải >= --hover-time trong CSS

    const NS = "http://www.w3.org/2000/svg";
    const board = document.getElementById("board");
    const grid = document.getElementById("grid");
    const svg = document.getElementById("strings");           // lớp dây nằm trên thẻ + đầu ghim
    const svgBack = document.getElementById("stringsBack");   // lớp dây nằm sau thẻ

    /* ---------- Tạo thẻ: slot (cố định) > a.card (xoay/phóng) ---------- */
    const cards = {};
    evidenceList.forEach((item, i) => {
      const slot = document.createElement("div");
      slot.className = "slot";

      const a = document.createElement("a");
      a.className = "card";
      a.href = item.link;
      a.setAttribute("aria-label", item.title);
      a.style.setProperty("--rot", TILTS[i % TILTS.length] + "deg");
      a.style.setProperty("--dx", DX[i % DX.length] + "em");
      a.style.setProperty("--dy", DY[i % DY.length] + "em");

      const pin = document.createElement("span");
      pin.className = "pin";
      pin.setAttribute("aria-hidden", "true");

      const photo = document.createElement("div");
      photo.className = "photo";
      const img = document.createElement("img");
      img.src = item.image;
      img.alt = item.title;
      img.draggable = false;
      img.addEventListener("error", () => { img.remove(); photo.classList.add("noimg"); });
      photo.appendChild(img);

      const cap = document.createElement("div");
      cap.className = "caption";
      cap.textContent = item.title;

      a.append(pin, photo, cap);
      slot.appendChild(a);
      grid.appendChild(slot);
      cards[item.id] = { slot, card: a, pin };
    });

    /* ---------- SVG: gradient ghim + dây + đầu ghim ---------- */
    svg.innerHTML =
      '<defs><radialGradient id="pinGrad" cx="35%" cy="30%" r="75%">' +
      '<stop offset="0" stop-color="#ff8a80"/><stop offset="0.55" stop-color="#c1272d"/><stop offset="1" stop-color="#7a1114"/>' +
      '</radialGradient></defs>';
    const gLines = document.createElementNS(NS, "g");
    const gBack = document.createElementNS(NS, "g");
    const gHeads = document.createElementNS(NS, "g");
    svg.append(gLines, gHeads);
    svgBack.append(gBack);

    // Dây của các thẻ trong danh sách này sẽ đi SAU thẻ (không đè lên mặt ảnh)
    const BEHIND = ["2"];

    function makeRope(behind) {
      const path = document.createElementNS(NS, "path");
      path.setAttribute("class", "line");
      (behind ? gBack : gLines).appendChild(path);
      return [path];
    }

    const links = [];
    const seen = new Set();
    evidenceList.forEach(item => {
      item.connections.forEach(otherId => {
        if (!cards[otherId]) return;
        const key = [item.id, otherId].sort().join("-");
        if (seen.has(key)) return;
        seen.add(key);
        links.push({ a: item.id, b: otherId, els: makeRope(BEHIND.includes(item.id) || BEHIND.includes(otherId)), k: links.length });
      });
      (item.hang || []).forEach(frac => {
        links.push({ a: item.id, b: null, hang: frac, els: makeRope(), k: links.length });
      });
    });

    const heads = {};
    evidenceList.forEach(item => {
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("class", "head");
      c.setAttribute("fill", "url(#pinGrad)");
      gHeads.appendChild(c);
      heads[item.id] = c;
    });

    /* ---------- Tọa độ TÂM ghim (đo thực tế) & hình dạng dây ---------- */
    const f = n => n.toFixed(1);
    const pts = {};
    let bw = 0; // chiều rộng bảng

    // Dây nối 2 ghim: võng xuống do trọng lực; dây gần thẳng đứng thì phình ra phía ngoài
    function sagPath(p, q, k) {
      const dx = q.x - p.x, dy = q.y - p.y, dist = Math.hypot(dx, dy);
      let mx = (p.x + q.x) / 2;
      let my = (p.y + q.y) / 2 + Math.min(80, 16 + dist * 0.14);
      if (Math.abs(dx) < dist * 0.4) {
        const outward = mx < bw / 2 ? -1 : 1;
        mx += outward * Math.min(70, 14 + dist * 0.2);
      }
      return "M" + f(p.x) + " " + f(p.y) + " Q" + f(mx) + " " + f(my) + " " + f(q.x) + " " + f(q.y);
    }

    // Dây kéo lên và ra khỏi mép trên của bảng
    function hangPath(p, frac) {
      const qx = p.x + frac * bw, qy = -50;
      const mx = (p.x + qx) / 2 + frac * bw * 0.35, my = (p.y + qy) / 2;
      return "M" + f(p.x) + " " + f(p.y) + " Q" + f(mx) + " " + f(my) + " " + f(qx) + " " + f(qy);
    }

    function measure(id, br) {
      const r = cards[id].pin.getBoundingClientRect();   // đã tính cả xoay + phóng to
      pts[id] = { x: r.left + r.width / 2 - br.left, y: r.top + r.height / 2 - br.top, r: r.width / 2 };
      const c = heads[id];
      c.setAttribute("cx", f(pts[id].x));
      c.setAttribute("cy", f(pts[id].y));
      c.setAttribute("r", f(pts[id].r));
    }

    function drawLinks(onlyId) {
      links.forEach(l => {
        if (onlyId && l.a !== onlyId && l.b !== onlyId) return;
        const d = l.b === null ? hangPath(pts[l.a], l.hang) : sagPath(pts[l.a], pts[l.b], l.k);
        l.els[0].setAttribute("d", d);
      });
    }

    function update() {
      const br = board.getBoundingClientRect();
      bw = br.width;
      svg.setAttribute("width", br.width);
      svg.setAttribute("height", br.height);
      svgBack.setAttribute("width", br.width);
      svgBack.setAttribute("height", br.height);
      for (const id in cards) measure(id, br);
      drawLinks();
    }

    // Khi 1 thẻ đang phóng to / thu nhỏ: chỉ đo lại ghim của thẻ đó + vẽ lại dây liên quan
    let raf = 0, until = 0, activeId = null;
    function pump(id, ms) {
      activeId = id;
      until = performance.now() + ms;
      if (!raf) raf = requestAnimationFrame(tick);
    }
    function tick() {
      measure(activeId, board.getBoundingClientRect());
      drawLinks(activeId);
      raf = performance.now() < until ? requestAnimationFrame(tick) : 0;
    }

    /* ---------- Hover: sáng các dây nối với ghim của thẻ ---------- */
    function setHot(id, on) {
      links.forEach(l => {
        if (l.a === id || l.b === id) l.els.forEach(el => el.classList.toggle("hot", on));
      });
      pump(id, HOVER_MS);
    }
    for (const id in cards) {
      const { slot, card } = cards[id];
      slot.addEventListener("pointerenter", () => setHot(id, true));
      slot.addEventListener("pointerleave", () => setHot(id, false));
      card.addEventListener("focus", () => setHot(id, true));
      card.addEventListener("blur", () => setHot(id, false));
    }

    window.addEventListener("resize", update);
    window.addEventListener("load", update);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(update);

    /* ---------- Đèn rọi theo con trỏ ---------- */
    let moving = false, mouse = null;
    board.addEventListener("pointermove", e => {
      mouse = e;
      if (moving) return;
      moving = true;
      requestAnimationFrame(() => {
        const r = board.getBoundingClientRect();
        board.style.setProperty("--mx", (mouse.clientX - r.left) + "px");
        board.style.setProperty("--my", (mouse.clientY - r.top) + "px");
        moving = false;
      });
    });
    board.addEventListener("pointerleave", () => {
      board.style.setProperty("--mx", "50%");
      board.style.setProperty("--my", "35%");
    });

    /* ---------- Chuyển sáng / tối ---------- */
    const MODE_KEY = "vocab_board_mode";
    const modeBtn = document.getElementById("modeBtn");
    function setMode(m) {
      document.body.dataset.mode = m;
      modeBtn.setAttribute("aria-pressed", m === "light");
      try { localStorage.setItem(MODE_KEY, m); } catch (e) {}
    }
    try { const saved = localStorage.getItem(MODE_KEY); if (saved === "light" || saved === "dark") setMode(saved); } catch (e) {}
    modeBtn.addEventListener("click", () => setMode(document.body.dataset.mode === "dark" ? "light" : "dark"));

    update();
  </script>
</body>
</html>
